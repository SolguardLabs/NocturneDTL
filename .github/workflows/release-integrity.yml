name: release-integrity

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main production --tags
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/production)"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          test "$main_sha" = "$production_sha"
          test "$main_sha" = "$tag_sha"
          if [[ "${{ github.event_name }}" = release ]]; then
            test "${{ github.event.release.name }}" = "Production 1.0.0"
          fi
